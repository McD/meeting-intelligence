[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "briefings-mcp"
version = "0.2.0"
description = "Local MCP server and ledger for the meeting-intelligence briefings plugin."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mark McDermott" }]
dependencies = [
    "fastmcp>=2.11,<3",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/meeting-intelligence"

[tool.setuptools.packages.find]
include = ["briefings_mcp*"]
